<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토마토 포모도로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 파스텔 배경 위에 둥근 카드 한 장, 가운데에 토마토 캐릭터와 진행 링 */
:root {
  --bg: #fff3ee;
  --card: #ffffff;
  --ink: #5a3b3b;
  --muted: #a98a86;
  --line: #ffe0d6;
  --mode: #ff6b5e;
  --mode-deep: #e04a3f;
  --mode-soft: #ffe1dc;
  --font: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
body[data-mode="short"] { --mode: #4cc59a; --mode-deep: #2fa57c; --mode-soft: #d9f5ea; --bg: #effaf4; --line: #d3f0e3; }
body[data-mode="long"]  { --mode: #8f9bff; --mode-deep: #6f7cf0; --mode-soft: #e3e6ff; --bg: #f2f3ff; --line: #dfe2ff; }

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font);
  background-image: radial-gradient(var(--line) 2px, transparent 2px);
  background-size: 24px 24px;
  display: flex; justify-content: center; padding: 20px 16px 32px;
  transition: background-color .4s;
}
.app { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 16px; }
h1 { margin: 0; text-align: center; font-size: 22px; font-weight: 400; color: var(--mode-deep); }

.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tab {
  border: 3px solid transparent; background: var(--card); color: var(--muted);
  font: 400 16px var(--font); padding: 10px 4px; border-radius: 999px; cursor: pointer;
  box-shadow: 0 3px 0 var(--line);
}
.tab[aria-selected="true"] { background: var(--mode); color: #fff; box-shadow: 0 3px 0 var(--mode-deep); }

.card {
  background: var(--card); border-radius: 32px; padding: 20px 20px 24px;
  box-shadow: 0 6px 0 var(--line); text-align: center;
}

.bubble {
  display: inline-block; background: var(--mode-soft); color: var(--mode-deep);
  border-radius: 18px; padding: 8px 16px; font-size: 16px; position: relative; margin-bottom: 14px; max-width: 100%;
}
.bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -8px;
  border: 8px solid transparent; border-bottom: 0; border-top-color: var(--mode-soft);
}

.stage { position: relative; width: min(100%, 280px); aspect-ratio: 1; margin: 0 auto; }
.stage svg { width: 100%; height: 100%; display: block; }
.ring-track { fill: none; stroke: var(--mode-soft); stroke-width: 9; }
.ring { fill: none; stroke: var(--mode); stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset .4s linear; transform: rotate(-90deg); transform-origin: 100px 100px; }
.body-fill { fill: var(--mode); transition: fill .3s; }
.body-shade { fill: var(--mode-deep); opacity: .18; }
.leaf { fill: #5cbf6a; }
.cheek { fill: #ff9fb0; opacity: .75; }
.face-ink { fill: #4a2c2c; }
.face-line { fill: none; stroke: #4a2c2c; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.mascot { transform-origin: 100px 160px; }
.running .mascot { animation: bounce 1s ease-in-out infinite; }
.eyes-open .blink { transform-origin: center; transform-box: fill-box; animation: blink 4s infinite; }
@keyframes bounce { 0%,100% { transform: translateY(0) scale(1,1); } 50% { transform: translateY(-6px) scale(1.02,.98); } }
@keyframes blink { 0%,94%,100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
.g-focus, .g-rest { display: none; }
body[data-mode="focus"] .g-focus { display: inline; }
body[data-mode="short"] .g-rest, body[data-mode="long"] .g-rest { display: inline; }

.time { font-size: 60px; line-height: 1; margin-top: 8px; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: 2px; }
.sub { color: var(--muted); font-size: 15px; margin-top: 6px; }

.controls { display: flex; gap: 10px; justify-content: center; align-items: center; margin-top: 18px; }
.btn { border: 0; font: 400 16px var(--font); cursor: pointer; border-radius: 999px; padding: 12px 14px; white-space: nowrap; background: var(--mode-soft); color: var(--mode-deep); box-shadow: 0 3px 0 var(--line); min-height: 48px; }
.btn.primary { background: var(--mode); color: #fff; font-size: 19px; padding: 12px 22px; box-shadow: 0 4px 0 var(--mode-deep); }
.btn:active { transform: translateY(2px); box-shadow: none; }
:focus-visible { outline: 3px solid var(--mode-deep); outline-offset: 3px; }

.stats { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 20px; flex-wrap: wrap; }
.dots { display: flex; gap: 6px; }
.dot { width: 16px; height: 16px; border-radius: 50%; background: var(--mode-soft); border: 2px solid var(--mode-soft); }
.dot.on { background: #ff6b5e; border-color: #e04a3f; }
.count { color: var(--muted); font-size: 15px; }
.count b { color: var(--mode-deep); font-size: 20px; font-weight: 400; }

details { background: var(--card); border-radius: 24px; padding: 14px 18px; box-shadow: 0 5px 0 var(--line); }
summary { cursor: pointer; font-size: 17px; color: var(--mode-deep); }
.settings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.field label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
.field input { width: 100%; font: 400 18px var(--font); color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 14px; padding: 8px 10px; text-align: center; }
.opts { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; font-size: 15px; color: var(--muted); }
.opts label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.opts input { width: 20px; height: 20px; accent-color: var(--mode); }

@media (max-width: 380px) { .time { font-size: 50px; } }
@media (prefers-reduced-motion: reduce) { .running .mascot, .eyes-open .blink { animation: none; } .ring { transition: none; } }
</style>
</head>
<body data-mode="focus">
<main class="app">
  <h1>토마토 포모도로</h1>

  <div class="tabs" role="tablist" aria-label="모드 선택">
    <button class="tab" role="tab" id="tab-focus" aria-selected="true">집중</button>
    <button class="tab" role="tab" id="tab-short" aria-selected="false">짧은 휴식</button>
    <button class="tab" role="tab" id="tab-long" aria-selected="false">긴 휴식</button>
  </div>

  <section class="card" aria-label="타이머" id="card">
    <div class="bubble" id="bubble">같이 집중해 볼까요?</div>
    <div class="stage">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="ring-track" cx="100" cy="100" r="92"></circle>
        <circle class="ring" id="ring" cx="100" cy="100" r="92"></circle>
        <g class="mascot">
          <ellipse class="body-fill" cx="100" cy="108" rx="62" ry="55"></ellipse>
          <ellipse class="body-shade" cx="100" cy="150" rx="46" ry="12"></ellipse>
          <path class="leaf" d="M100 58 C88 46 74 50 70 56 C80 60 90 60 100 58 C110 60 120 60 130 56 C126 50 112 46 100 58 Z"></path>
          <path class="leaf" d="M100 60 C98 48 100 40 104 34 C108 44 106 54 100 60 Z"></path>
          <ellipse class="cheek" cx="66" cy="116" rx="9" ry="6"></ellipse>
          <ellipse class="cheek" cx="134" cy="116" rx="9" ry="6"></ellipse>
          <g class="g-focus" id="eyes-focus">
            <g class="blink"><ellipse class="face-ink" cx="80" cy="102" rx="6" ry="8"></ellipse></g>
            <g class="blink"><ellipse class="face-ink" cx="120" cy="102" rx="6" ry="8"></ellipse></g>
            <circle fill="#fff" cx="82" cy="99" r="2.2"></circle><circle fill="#fff" cx="122" cy="99" r="2.2"></circle>
            <path class="face-line" d="M90 122 Q100 130 110 122"></path>
          </g>
          <g class="g-rest">
            <path class="face-line" d="M72 104 Q80 94 88 104"></path>
            <path class="face-line" d="M112 104 Q120 94 128 104"></path>
            <path class="face-line" d="M88 120 Q100 136 112 120 Z" style="fill:#ff8a8a"></path>
          </g>
        </g>
      </svg>
    </div>
    <div class="time" id="time" role="timer" aria-live="off">25:00</div>
    <div class="sub" id="sub">집중 시간</div>

    <div class="controls">
      <button class="btn" id="reset" aria-label="초기화">처음</button>
      <button class="btn primary" id="start">시작</button>
      <button class="btn" id="skip" aria-label="건너뛰기">건너뛰기</button>
    </div>

    <div class="stats">
      <div class="dots" id="dots" aria-label="현재 회차"></div>
      <div class="count">오늘 모은 토마토 <b id="today">0</b>개</div>
    </div>
  </section>

  <details>
    <summary>시간 설정</summary>
    <div class="settings">
      <div class="field"><label for="s-focus">집중(분)</label><input id="s-focus" type="number" min="1" max="180" value="25" inputmode="numeric"></div>
      <div class="field"><label for="s-short">짧은 휴식</label><input id="s-short" type="number" min="1" max="60" value="5" inputmode="numeric"></div>
      <div class="field"><label for="s-long">긴 휴식</label><input id="s-long" type="number" min="1" max="120" value="15" inputmode="numeric"></div>
    </div>
    <div class="opts">
      <label for="o-auto"><input id="o-auto" type="checkbox"> 다음 단계 자동 시작</label>
      <label for="o-sound"><input id="o-sound" type="checkbox" checked> 끝나면 알림음</label>
    </div>
  </details>
</main>

<script>
(function () {
  var C = 2 * Math.PI * 92;
  var ring = document.getElementById('ring');
  ring.style.strokeDasharray = C;
  var $ = function (id) { return document.getElementById(id); };

  var cfg = { focus: 25, short: 5, long: 15 };
  var SUB = { focus: '집중 시간', short: '짧은 휴식 시간', long: '긴 휴식 시간' };
  var MSG = {
    focus: ['같이 집중해 볼까요?', '지금 하는 일에 쏙 빠져 봐요!', '조금만 더 힘내요!', '잘하고 있어요!'],
    short: ['물 한 모금 마셔요', '기지개를 쭉 펴 봐요', '눈을 잠깐 쉬게 해 줘요'],
    long: ['푹 쉬고 와요', '산책 다녀올까요?', '긴 휴식이에요, 수고했어요!']
  };
  var DONE = { focus: '토마토 하나 완성!', short: '다시 집중할 시간이에요', long: '새 세트를 시작해요' };

  var mode = 'focus', total = 0, remain = 0, running = false, endAt = 0, tick = null, round = 0, today = 0;

  var todayKey = 'tomato-' + new Date().toISOString().slice(0, 10);
  try {
    today = parseInt(localStorage.getItem(todayKey) || '0', 10) || 0;
    var saved = JSON.parse(localStorage.getItem('tomato-cfg') || 'null');
    if (saved) { cfg = saved.cfg || cfg; $('o-auto').checked = !!saved.auto; $('o-sound').checked = saved.sound !== false; }
  } catch (e) {}
  $('s-focus').value = cfg.focus; $('s-short').value = cfg.short; $('s-long').value = cfg.long;
  total = remain = cfg[mode] * 60;

  function save() {
    try {
      localStorage.setItem(todayKey, String(today));
      localStorage.setItem('tomato-cfg', JSON.stringify({ cfg: cfg, auto: $('o-auto').checked, sound: $('o-sound').checked }));
    } catch (e) {}
  }
  function pick(m) { var a = MSG[m]; return a[Math.floor(Math.random() * a.length)]; }
  function fmt(s) { var m = Math.floor(s / 60), r = s % 60; return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; }

  function render() {
    $('time').textContent = fmt(remain);
    ring.style.strokeDashoffset = C * (1 - (total ? remain / total : 0));
    $('start').textContent = running ? '일시정지' : (remain < total ? '계속' : '시작');
    $('today').textContent = today;
    $('sub').textContent = SUB[mode];
    document.title = running ? fmt(remain) + ' · 토마토 포모도로' : '토마토 포모도로';
    var dots = $('dots'); dots.innerHTML = '';
    for (var i = 0; i < 4; i++) {
      var d = document.createElement('span');
      d.className = 'dot' + (i < round ? ' on' : '');
      dots.appendChild(d);
    }
    dots.setAttribute('aria-label', '이번 세트 ' + round + '/4');
    document.body.setAttribute('data-mode', mode);
    $('card').className = 'card' + (running ? ' running' : '') + (mode === 'focus' ? ' eyes-open' : '');
    ['focus', 'short', 'long'].forEach(function (m) { $('tab-' + m).setAttribute('aria-selected', m === mode ? 'true' : 'false'); });
  }
  function say(t) { $('bubble').textContent = t; }

  function stop() { running = false; clearInterval(tick); tick = null; }
  function setMode(m) { stop(); mode = m; total = remain = cfg[m] * 60; say(pick(m)); render(); }

  function beep() {
    if (!$('o-sound').checked) return;
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      var ac = new Ctx(), t = ac.currentTime;
      [659, 784, 988].forEach(function (f, i) {
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        var s = t + i * 0.2;
        g.gain.setValueAtTime(0.0001, s);
        g.gain.exponentialRampToValueAtTime(0.3, s + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, s + 0.18);
        o.connect(g); g.connect(ac.destination); o.start(s); o.stop(s + 0.2);
      });
    } catch (e) {}
  }

  function next() {
    var wasFocus = mode === 'focus', nm;
    if (wasFocus) { today++; round++; nm = round >= 4 ? 'long' : 'short'; }
    else { nm = 'focus'; if (mode === 'long') round = 0; }
    var done = DONE[mode];
    mode = nm; total = remain = cfg[nm] * 60;
    say(done); save(); render();
  }

  function finish() { stop(); remain = 0; render(); beep(); next(); if ($('o-auto').checked) start(); }
  function onTick() {
    remain = Math.max(0, Math.round((endAt - Date.now()) / 1000));
    if (remain <= 0) { finish(); return; }
    render();
  }
  function start() {
    if (running) return;
    running = true; endAt = Date.now() + remain * 1000;
    tick = setInterval(onTick, 250);
    if (remain === total) say(pick(mode));
    render();
  }

  $('start').onclick = function () { if (running) { stop(); say('잠깐 쉬는 중이에요'); render(); } else { start(); } };
  $('reset').onclick = function () { stop(); remain = total; say(pick(mode)); render(); };
  $('skip').onclick = function () { stop(); next(); };
  ['focus', 'short', 'long'].forEach(function (m) { $('tab-' + m).onclick = function () { setMode(m); }; });

  function applySettings() {
    ['focus', 'short', 'long'].forEach(function (k) {
      var v = parseInt($('s-' + k).value, 10);
      var max = k === 'focus' ? 180 : (k === 'short' ? 60 : 120);
      if (v >= 1 && v <= max) cfg[k] = v;
    });
    save();
    if (!running) { total = remain = cfg[mode] * 60; render(); }
  }
  ['s-focus', 's-short', 's-long'].forEach(function (id) { $(id).addEventListener('change', applySettings); });
  $('o-auto').addEventListener('change', save);
  $('o-sound').addEventListener('change', save);

  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && !/INPUT|BUTTON|SUMMARY/.test(document.activeElement.tagName)) { e.preventDefault(); $('start').click(); }
  });

  say(pick(mode));
  render();
})();
</script>
</body>
</html>
